<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetings Overview</title>
<style>
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#fff; font-family:Arial,sans-serif; }
body { display:flex; flex-direction:column; }
.report-nav { display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex-shrink:0; padding:8px 12px; background:#0F2A43; color:#fff; }
.report-nav strong { flex:1; font-size:14px; }
.report-nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.report-nav a { display:inline-block; padding:7px 10px; border:1px solid #b5c7d8; border-radius:5px; background:#fff; color:#0F2A43; text-decoration:none; font-size:13px; font-weight:600; }
.report-nav a:hover { background:#edf3f8; }
.report-nav a:focus-visible { outline:3px solid #E8792B; outline-offset:2px; }
iframe { display:block; width:100%; flex:1; min-height:0; border:0; }

.governance-menu { position:relative; }
.governance-menu summary { display:block; padding:7px 10px; border:1px solid #b5c7d8; border-radius:5px; background:#fff; color:#0F2A43; font-size:13px; font-weight:600; cursor:pointer; list-style:none; }
.governance-menu summary::-webkit-details-marker { display:none; }
.governance-menu summary::after { content:" ▾"; }
.governance-menu[open] summary { background:#edf3f8; }
.governance-menu summary:focus-visible { outline:3px solid #E8792B; outline-offset:2px; }
.governance-links { position:absolute; right:0; top:calc(100% + 6px); z-index:20; display:flex; flex-direction:column; gap:4px; width:260px; max-width:calc(100vw - 24px); padding:8px; box-sizing:border-box; border:1px solid #E2E5EA; border-radius:8px; background:#fff; box-shadow:0 8px 24px rgba(15,42,67,.2); }
.governance-links a { border:0; }
.governance-links a[aria-current="page"] { background:#edf3f8; }
</style>
</head>
<body>
<nav class="report-nav" aria-label="Report navigation">
  <strong>Meeting Register &amp; Minutes</strong>
  <div class="report-nav-links">
    <details class="governance-menu">
      <summary>Board &amp; Governance</summary>
      <div class="governance-links" aria-label="Board and Governance pages">
        <a href="meetings.html" aria-current="page">Meeting Register &amp; Minutes</a>
        <a href="sh-action-centre.html">Staff Huddle Action Centre</a>
        <a href="flow-failure-monitoring.html">Flow Failure Monitoring</a>
        <a href="review-register-compliance.html">Review Register Compliance</a>
      </div>
    </details>
    <a id="portal-back" href="directors.html">Back</a>
    <a href="directors.html#resources">Show portal menu</a>
    <a href="index.html">Staff Portal</a>
  </div>
</nav>
<iframe title="Meetings Overview" src="https://app.powerbi.com/view?r=eyJrIjoiM2MzY2VhZjMtM2M2Ny00MmE0LTkwMWMtOTdmODhiMTQ2MGMxIiwidCI6ImZlYzQ4MWE4LWVhZGMtNDkzMi1hMzIzLTlhYzUwYWQyMWNmZiJ9&amp;pageName=5523c163bb6f0742814b" allowfullscreen></iframe>
<script>
(function () {
  // Return to the referring portal page without stepping through report history.
  if (!document.referrer) return;
  try {
    var previous = new URL(document.referrer);
    if (previous.origin === location.origin && previous.pathname !== location.pathname) {
      document.getElementById('portal-back').href = previous.href;
    }
  } catch (error) { /* Keep the Directors fallback if the referrer is unavailable. */ }
})();
</script>
<script>
(function () {
  var menu = document.querySelector('.governance-menu');
  document.addEventListener('click', function (event) {
    if (!menu.contains(event.target)) menu.open = false;
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && menu.open) {
      menu.open = false;
      menu.querySelector('summary').focus();
    }
  });
})();
</script>
</body>
</html>
